steps:
  # 步驟 1: 強制「無快取」建置
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--no-cache"
      - "--pull"
      - "-t"
      # ❗️ 標籤 1/3 (必須一致)
      - "gcr.io/news-bot-v2/news-bot:v3-7-2"
      - "."

  # 步驟 2: 推送映像
  - name: "gcr.io/cloud-builders/docker"
    # ❗️ 標籤 2/3 (必須一致)
    args: ["push", "gcr.io/news-bot-v2/news-bot:v3-7-2"]

# 將映像 URL 寫入日誌
images:
  # ❗️ 標籤 3/3 (必須一致)
  - "gcr.io/news-bot-v2/news-bot:v3-7-2"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
