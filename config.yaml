# ============================================================================
# LINE Bot 新聞推播系統設定檔
# ============================================================================

# 基本設定
env: "development"
app:
  name: "LINE News Bot"
  version: "3.7.2"
  timezone: "Asia/Taipei"
  log_level: "INFO"

# 新聞來源設定
# [v3.7.0] 移除 Reuters (域名已停止解析) 與 CNN (feed 凍結於 2023-04，是舊聞推播的元凶)
# [v3.7.0] 新增 NYT 與 NBC News (官方 world feed)
news_sources:
  rss_feeds:
    BBC: "https://feeds.bbci.co.uk/news/world/rss.xml"
    Fox_News: "https://moxie.foxnews.com/google-publisher/world.xml"
    NYT: "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"
    NBC_News: "https://feeds.nbcnews.com/nbcnews/public/world"
    Al_Jazeera: "https://www.aljazeera.com/xml/rss/all.xml"

  html_sources:
  #將半島電視台暫時註解
  #Al_Jazeera:
  #  url: "https://www.aljazeera.com/news/"
  #  # 使用逗號分隔，匹配多種可能的容器
  #  selector: "article.gc, div.card-live"
  #  # 匹配多種可能的標題結構
  #  title_selector: 'h3.gc__title, [data-testid="card-title"]'
  #  # 匹配多種可能的連結結構
  #  link_selector: "a.u-clickable-card__link, a"
  #  content_selector: "div.wysiwyg--all-content"
  #  max_articles: 15

# AI 模型設定
# [v3.7.2] 改用低價付費模型：free 模型受全球性限流 (8 req/min) 與每日 50 次配額限制，
# 實測無法支撐每輪 10+ 個請求。摘要沿用本專案原本的 gemma-3-12b-it (付費版)。
# 需要 OpenRouter 帳戶有儲值 (https://openrouter.ai/settings/credits)
ai_models:
  classification:
    model: "google/gemini-2.5-flash-lite"
    temperature: 0.1
    max_tokens_per_article: 30
    timeout: 60

  summarization:
    model: "google/gemma-3-12b-it"
    temperature: 0.6
    max_tokens: 500
    timeout: 90

# 分類器設定
# [v3.7.2] 付費模型限流寬鬆，並發回調至 3 (429 退避重試保留作為安全網)
classifier:
  max_concurrent: 3
  batch_size: 8
  max_retries: 3
  retry_delay: 1.0
  scope_keywords:
    global: ["global", "全球性", "國際性", "worldwide", "international"]
    regional:
      [
        "regional",
        "區域性",
        "局部性",
        "國外",
        "地區",
        "區域",
        "european",
        "asian",
        "african",
      ]
    domestic: ["domestic", "國內性", "local", "national"]

# 新聞處理設定
news_processing:
  max_news_per_source: 20
  min_content_length: 50
  max_content_preview: 2000
  similarity_threshold: 0.7
  max_groups_to_process: 5
  max_news_per_source_in_final: 2
  max_final_news: 5
  # [v3.7.0] 時效性過濾：超過此天數的新聞一律丟棄；無發布日期的條目也一律丟棄
  max_news_age_days: 3
  allow_no_publish_date: false

# HTTP 請求設定
http:
  timeout: 15
  max_retries: 3
  retry_delay: 1.0
  user_agent: "Mozilla/5.0 (compatible; NewsBot/2.0)"

# Google Sheets 設定
google_sheets:
  worksheets:
    sent_news_log: "sent_news_log"
    glossary: "glossary"
  glossary_columns:
    english_term: "English_Term"
    taiwan_term: "Taiwan_Term"

# LINE Bot 設定
line_bot:
  message_delay: 1.0
  header_templates:
    morning: "🆕 {date} 晨間國際新聞推播"
    afternoon: "🆕 {date} 午間國際新聞推播"
    evening: "🆕 {date} 晚間國際新聞推播"
  time_periods:
    morning: [5, 12]
    afternoon: [12, 18]
    evening: [18, 5]

# 術語替換設定 (fallback)
default_translations:
  "特朗普": "川普"
  "加沙": "加薩"
  "內塔尼亞胡": "納坦雅胡"
  "哈梅內伊": "哈米尼"

# Cloud Run 最佳化設定
cloud_run:
  max_execution_time: 540 # 9分鐘 (Cloud Run 預設 15分鐘的緩衝)
  memory_limit_mb: 512
  cpu_limit: 1.0
